<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>からだの立体図鑑｜感じて覚える運動解剖学</title>
<style>
  :root{
    --bg:#f4f1ec;
    --ink:#26221c;
    --ink2:#5a5347;
    --ink3:#8a8175;
    --hair:rgba(38,34,28,.14);
    --glass:rgba(252,250,247,.72);
    --glass-strong:rgba(252,250,247,.9);
    --accent:#9c635a;
    --shadow:0 1px 2px rgba(40,34,26,.06), 0 12px 32px rgba(40,34,26,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:100%/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    overscroll-behavior:none;
  }
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  /* ── 上：いま触っているものの名前。3Dの上に浮かせる ── */
  #label{
    position:fixed;top:0;left:0;right:0;z-index:3;
    padding:calc(14px + env(safe-area-inset-top)) 20px 0;
    pointer-events:none;text-align:center;
  }
  #label .ja{
    font-size:1.35rem;font-weight:600;line-height:1.3;
    letter-spacing:-.01em;              /* 大きい字は詰める */
    min-height:1.3em;
  }
  #label .en{
    font-size:.8125rem;color:var(--ink2);margin-top:.15em;
    letter-spacing:.01em;min-height:1.2em;
  }
  #hint{
    font-size:.8125rem;color:var(--ink3);margin-top:.6em;
    transition:opacity .4s ease;letter-spacing:.01em;
  }
  /* 隠す・薄くする・検索のあとに出る「表示を元に戻す」 */
  #restore{
    position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:5;
    font:inherit;font-size:.8125rem;line-height:1;
    padding:10px 14px;border-radius:999px;
    border:1px solid var(--hair);background:var(--glass-strong);color:var(--ink);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow);cursor:pointer;
  }
  #restore:active{transform:scale(.95)}

  /* ── 目次（系統→区画・部位→構造の一覧から辿る） ── */
  #catalog{
    position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);z-index:7;
    max-width:680px;margin:0 auto;
    max-height:66vh;overflow-y:auto;
    background:var(--glass-strong);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:16px;box-shadow:var(--shadow);
    padding:8px;
  }
  #catalog .lv1, #catalog .lv2{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    width:100%;min-height:48px;padding:8px 14px;border:none;border-radius:10px;
    background:transparent;text-align:left;font-weight:600;
  }
  #catalog .lv2{font-weight:500;padding-left:26px;min-height:44px}
  #catalog .lv1:active, #catalog .lv2:active, #catalog .item:active{background:rgba(38,34,28,.06);transform:none}
  #catalog .count{font-size:.75rem;color:var(--ink3);font-weight:400}
  #catalog .item{
    display:block;width:100%;min-height:42px;padding:6px 14px 6px 40px;
    border:none;border-radius:10px;background:transparent;text-align:left;
    font-size:.9375rem;color:var(--ink2);
  }
  #catalog .item .en{display:block;font-size:.71875rem;color:var(--ink3)}

  /* ── 下：半透明のガラスの操作板 ── */
  #dock{
    position:fixed;left:0;right:0;bottom:0;z-index:4;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:6px;align-items:center;
    transition:transform .32s cubic-bezier(.2,0,0,1), opacity .24s ease;
    background:var(--glass);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid rgba(255,255,255,.55);
    box-shadow:0 -1px 0 var(--hair);
  }
  /* 高さを取らないよう、はみ出す分は横に流す（折り返して2段3段にしない） */
  .row{
    display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-start;
    width:100%;max-width:680px;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-ms-overflow-style:none;
    padding:1px 2px;scroll-snap-type:x proximity;
  }
  .row::-webkit-scrollbar{display:none}
  .row > *{flex:0 0 auto;scroll-snap-align:start}
  @media (min-width:700px){ .row{justify-content:center} }
  /* 広い画面では列を広げて、横に流さず全部見せる */
  @media (min-width:1000px){ .row{max-width:960px} }
  @media (min-width:1240px){ .row{max-width:1180px} }
  button{
    font:inherit;font-size:.9375rem;line-height:1;white-space:nowrap;
    min-height:44px;padding:0 15px;border-radius:999px;
    border:1px solid var(--hair);background:rgba(255,255,255,.7);color:var(--ink2);
    cursor:pointer;
    /* 押した瞬間に応える。離してからではない */
    transition:transform .1s cubic-bezier(.2,0,0,1), background .16s ease, color .16s ease, border-color .16s ease;
  }
  button:active{transform:scale(.94)}
  button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  button.busy{opacity:.5}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #dock.down{transform:translate3d(0,100%,0);opacity:0;pointer-events:none}
  #credit{font-size:.6875rem;color:var(--ink3);text-align:center;line-height:1.4;letter-spacing:.01em}
  #credit a{color:var(--ink3)}

  /* ── 操作の列：見出しつきの一列（静かな見た目） ── */
  #controls{
    display:flex;align-items:stretch;
    width:100%;max-width:680px;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-ms-overflow-style:none;
    padding:2px 0;
  }
  #controls::-webkit-scrollbar{display:none}
  .grp{
    display:flex;flex-direction:column;gap:3px;
    padding:0 16px;border-left:1px solid var(--hair);
    flex:0 0 auto;
  }
  .grp:first-child{border-left:none;padding-left:2px}
  .cap{
    font-size:.6875rem;color:var(--ink3);letter-spacing:.14em;
    padding-left:10px;
  }
  .btns{display:flex;gap:2px}
  #controls button{
    background:transparent;border:none;color:var(--ink2);
    min-height:40px;padding:0 12px;border-radius:10px;
    font-size:.875rem;
  }
  #controls button.on{background:var(--ink);color:#fff}
  #controls button:active{background:rgba(38,34,28,.08);transform:scale(.96)}
  #controls button.on:active{background:var(--ink)}
  #subregions button{min-height:36px;font-size:.8125rem;color:var(--ink3)}
  #subregions button.on{background:var(--ink);color:#fff}
  /* 広い画面では折り返して全部見せる（真ん中寄せ＋はみ出しは左端が画面の外に出るので使わない） */
  @media (min-width:1000px){
    #controls{max-width:1180px;flex-wrap:wrap;justify-content:center;overflow:visible;row-gap:8px}
  }

  /* ── なまえで引く ── */
  #searchrow{align-items:center}
  #search{
    flex:1 1 auto;min-width:0;
    font:inherit;font-size:16px;   /* 16px未満だとiPhoneが勝手に拡大する */
    min-height:44px;padding:0 16px;border-radius:999px;
    border:1px solid var(--hair);background:rgba(255,255,255,.7);color:var(--ink);
    outline:none;
  }
  #search:focus{border-color:var(--accent)}
  #search::placeholder{color:var(--ink3)}
  #search-results{
    position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);z-index:7;
    max-width:680px;margin:0 auto;
    max-height:46vh;overflow-y:auto;
    background:var(--glass-strong);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:16px;box-shadow:var(--shadow);
    padding:6px;
  }
  #search-results .result{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    width:100%;min-height:48px;padding:8px 14px;border:none;border-radius:10px;
    background:transparent;text-align:left;
  }
  #search-results .result:active{background:rgba(38,34,28,.06);transform:none}
  #search-results .result .tag{font-size:.75rem;color:var(--ink3)}

  /* 2回目以降の読み込み表示は、画面を隠さない小さな札にする */
  #loading.pill{
    inset:auto;left:50%;top:calc(10px + env(safe-area-inset-top));
    transform:translateX(-50%);
    background:var(--glass-strong);border:1px solid var(--hair);
    border-radius:999px;padding:8px 16px;font-size:.8125rem;
    box-shadow:var(--shadow);place-items:unset;display:block;
  }

  /* ── 下から出るシート。掴んで下げられる ── */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    transform:translate3d(0,100%,0);
    will-change:transform;
    background:var(--glass-strong);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border-radius:20px 20px 0 0;
    border-top:1px solid rgba(255,255,255,.6);
    box-shadow:var(--shadow);
    padding:8px 20px calc(22px + env(safe-area-inset-bottom));
    touch-action:none;
  }
  #grip{
    width:38px;height:5px;border-radius:99px;background:rgba(38,34,28,.2);
    margin:0 auto 14px;
  }
  #sheet .name{font-size:1.5rem;font-weight:600;line-height:1.25;letter-spacing:-.015em}
  #sheet .sub{font-size:.875rem;color:var(--ink2);margin-top:.35em;letter-spacing:.01em}
  #sheet .meta{font-size:.8125rem;color:var(--ink3);margin-top:.9em}
  /* 筋の起始・停止・支配神経（データのある筋だけに出る） */
  #s-facts{margin-top:10px}
  #s-facts .frow{
    display:grid;grid-template-columns:5.5em 1fr;gap:6px;
    padding:5px 0;border-top:1px solid var(--hair);
    font-size:.8125rem;line-height:1.6;
  }
  #s-facts .frow:first-child{border-top:none}
  #s-facts .k{color:var(--ink3)}
  #s-facts .v{color:var(--ink)}
  #s-facts .src{font-size:.71875rem;color:var(--ink3);margin-top:4px}

  /* 名前の下の操作（売れているアプリと同じ4つ組） */
  #s-ops{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
  #s-ops::-webkit-scrollbar{display:none}
  #s-ops button{font-size:.875rem;min-height:40px;flex:0 0 auto}
  #sheet a.go{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:16px;padding:15px 18px;border-radius:14px;
    background:var(--ink);color:#fff;text-decoration:none;
    font-size:.9375rem;font-weight:600;letter-spacing:.005em;
    transition:transform .1s cubic-bezier(.2,0,0,1), opacity .16s ease;
  }
  a.go:active{transform:scale(.985);opacity:.9}
  a.go .arrow{opacity:.65;font-weight:400}
  #sheet .none{
    margin-top:16px;padding:14px 16px;border-radius:14px;
    background:rgba(38,34,28,.05);color:var(--ink2);font-size:.875rem;line-height:1.6;
  }

  #loading{
    position:fixed;inset:0;z-index:8;display:grid;place-items:center;
    background:var(--bg);font-size:.9375rem;color:var(--ink2);
  }
  #loading.hidden{display:none}

  @media (max-width:420px){
    #label .ja{font-size:1.2rem}
    button{font-size:.875rem;padding:0 13px}
    #sheet .name{font-size:1.3rem}
  }
  /* 動きを減らす設定のときは、跳ねさせない */
  @media (prefers-reduced-motion: reduce){
    button, a.go{transition:opacity .16s ease}
    button:active, a.go:active{transform:none}
  }
  /* 透過を減らす設定のときは、すりガラスをやめて塗る */
  @media (prefers-reduced-transparency: reduce){
    #dock,#sheet{background:#fbf9f6;backdrop-filter:none;-webkit-backdrop-filter:none}
  }
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="label">
    <div class="ja" id="ja"></div>
    <div class="en" id="en"></div>
    <div id="hint">1本指でまわす・2本指でずらす・つまんで拡大。2回たたくと、そこへ寄ります</div>
  </div>

  <button id="restore" hidden>表示を元に戻す</button>

  <div id="dock">
    <div id="search-results" hidden></div>
    <div id="catalog" hidden></div>
    <div class="row" id="searchrow">
      <button id="catalog-btn">目次</button>
      <input id="search" type="search" autocomplete="off" placeholder="なまえで引く（例：僧帽筋）">
      <button id="search-clear" class="plain" hidden>もどす</button>
    </div>
    <div id="controls">
      <div class="grp">
        <span class="cap">部位</span>
        <div class="btns" id="regions"></div>
        <div class="btns" id="subregions" style="display:none"></div>
      </div>
      <div class="grp">
        <span class="cap">層</span>
        <div class="btns" id="strata"></div>
      </div>
      <div class="grp">
        <span class="cap">はがす</span>
        <div class="btns" id="peel"></div>
      </div>
      <div class="grp">
        <span class="cap">足す</span>
        <div class="btns" id="layers"></div>
      </div>
      <div class="grp">
        <span class="cap">向き</span>
        <div class="btns" id="views"></div>
      </div>
    </div>
    <div id="credit">
      3Dデータ：Z-Anatomy / BodyParts3D（CC BY-SA 4.0）
    </div>
  </div>

  <div id="sheet" aria-hidden="true">
    <div id="grip"></div>
    <div class="name" id="s-name"></div>
    <div class="sub" id="s-sub"></div>
    <div class="meta" id="s-meta"></div>
    <div id="s-facts"></div>
    <div id="s-ops">
      <button id="op-isolate">これだけ見る</button>
      <button id="op-fade-others">まわりを薄く</button>
      <button id="op-hide-others">まわりを隠す</button>
      <button id="op-fade">薄くする</button>
      <button id="op-hide">隠す</button>
    </div>
    <div id="s-link"></div>
  </div>

  <div id="loading">読み込んでいます…</div>

  <script type="module" src="./app.js?v=10"></script>
</body>
</html>
